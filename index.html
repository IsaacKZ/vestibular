<style>
  :root {
    color-scheme: light;
    --accent: #0F5F52;
    --accent-ink: #ffffff;
    --accent-weak: #E2EDE9;
    --amber: #A4530B;
    --amber-bg: #FBEEDF;
    --amber-border: #E8C293;
    --bg: #F6F8F6;
    --bg-elevated: #FFFFFF;
    --bg-sunken: #EEF2EF;
    --border: #DAE2DD;
    --text: #1A211D;
    --text-muted: #576259;
    --text-faint: #8B968E;
    --font-title: 'Spectral', Georgia, 'Times New Roman', serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 1px 1px rgba(20, 30, 25, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --accent: #5FC0AC;
      --accent-ink: #06211C;
      --accent-weak: #17332C;
      --amber: #DD9E4C;
      --amber-bg: #2E230F;
      --amber-border: #4B3717;
      --bg: #12140F;
      --bg-elevated: #1B1E19;
      --bg-sunken: #0E100D;
      --border: #2B322C;
      --text: #E9EDE8;
      --text-muted: #A4AEA5;
      --text-faint: #6D766E;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --accent: #5FC0AC;
    --accent-ink: #06211C;
    --accent-weak: #17332C;
    --amber: #DD9E4C;
    --amber-bg: #2E230F;
    --amber-border: #4B3717;
    --bg: #12140F;
    --bg-elevated: #1B1E19;
    --bg-sunken: #0E100D;
    --border: #2B322C;
    --text: #E9EDE8;
    --text-muted: #A4AEA5;
    --text-faint: #6D766E;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));

  h1, h2, h3 { font-family: var(--font-title); font-weight: 600; margin: 0 0 .4em; letter-spacing: -0.01em; }

  h2 { font-size: 1.2rem; }
  h3 { font-size: 1.02rem; }
  p { margin: 0 0 .6em; }
  a { color: var(--accent); }
  .num, .tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button, select, input, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
  button { cursor: pointer; }
  fieldset { border: none; margin: 0; padding: 0; }
  legend { padding: 0; }

  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg-elevated); position: sticky; top: 0; z-index: 20;
  }
  header.topbar h1 { font-size: 1.15rem; margin: 0; }
  .icon-btn {
    min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: .82rem; font-family: var(--font-mono); padding: 0 10px;
  }
  .icon-btn:active { background: var(--bg-sunken); }

  main { max-width: 720px; margin: 0 auto; padding: 16px; }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; background: var(--bg-elevated); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1; background: none; border: none; padding: 10px 4px 8px; min-height: 56px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-muted); font-size: .74rem; border-top: 2px solid transparent;
  }
  nav.tabs button .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0; }
  nav.tabs button[aria-current="true"] { color: var(--accent); border-top-color: var(--accent); font-weight: 600; }

  .card {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); font-size: .85rem; }
  .small { font-size: .85rem; }

  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi { background: var(--bg-sunken); border-radius: var(--radius); padding: 10px 12px; }
  .kpi .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 4px; }
  .kpi .value { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 600; }

  .frase-destaque {
    border: 1px solid var(--border); background: var(--accent-weak);
    padding: 10px 14px; border-radius: var(--radius); font-style: italic;
    color: var(--text);
  }

  .banner {
    border: 1px solid var(--amber-border); background: var(--amber-bg); color: var(--text);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px;
  }
  .banner.critico { border-width: 2px; }
  .banner strong { color: var(--amber); }

  .bloco {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
    background: var(--bg-sunken);
  }
  .bloco.feito { opacity: .6; }
  .bloco-head { display: flex; align-items: flex-start; gap: 10px; }
  .checkbox-tap {
    width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0;
  }
  .check-hit {
    min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin: -11px 0;
  }
  .check-row {
    display: flex; align-items: center; gap: 8px; min-height: 44px;
  }
  .bloco-info { flex: 1; }
  .bloco-materia { font-weight: 600; }
  .bloco-topico { color: var(--text-muted); font-size: .92rem; }
  .bloco-modo { font-family: var(--font-mono); font-size: .74rem; color: var(--text-faint); margin-top: 2px; }

  .timer-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .timer-display { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; }
  .timer-fase { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
  .timer-controls { display: flex; gap: 8px; margin-top: 8px; }

  button.btn {
    min-height: 44px; padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-elevated); font-weight: 500;
  }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.btn.primary:disabled { background: var(--bg-sunken); border-color: var(--border); color: var(--text-faint); }
  button.btn.ghost { background: transparent; }
  button.btn.small { min-height: 44px; padding: 0 12px; font-size: .85rem; }
  button.btn.full { width: 100%; }
  button.btn:active:not(:disabled) { background: var(--bg-sunken); }
  button.btn.primary:active:not(:disabled) { filter: brightness(0.95); }

  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: .82rem; color: var(--text-muted); margin-bottom: 5px; }
  select, textarea, input[type="text"], input[type="date"], input[type="number"] {
    width: 100%; min-height: 44px; padding: 8px 12px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text);

  textarea { min-height: 76px; resize: vertical; }

  .causa-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .causa-btn {
    min-height: 44px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-elevated); flex: 1 1 auto;
  }
  .causa-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .fase-group { margin-bottom: 16px; }
  .fase-header {
    display: flex; justify-content: space-between; align-items: baseline; padding: 6px 2px;
    border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  .sessao-item {
    display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: var(--radius);
    border: 1px solid var(--border); margin-bottom: 6px; background: var(--bg-elevated);
  }
  .sessao-item.concluida { opacity: .55; }
  .sessao-item.atual { border-color: var(--accent); background: var(--accent-weak); }
  .sessao-idx { font-family: var(--font-mono); color: var(--text-faint); min-width: 2.4em; }
  .sessao-blocos { flex: 1; }
  .sessao-blocos .b { font-size: .9rem; }
  .sessao-blocos .b + .b { color: var(--text-muted); }

  .bar-row { margin-bottom: 12px; }
  .bar-row .bar-label { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 4px; }
  .bar-track { height: 10px; background: var(--bg-sunken); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; }
  .bar-fill.amber { background: var(--amber); }

  table.simples { width: 100%; border-collapse: collapse; font-size: .9rem; }
  table.simples th, table.simples td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  table.simples th { color: var(--text-muted); font-weight: 500; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; }

  .erro-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; background: var(--bg-elevated); }
  .erro-top { display: flex; justify-content: space-between; gap: 8px; }
  .tag { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .72rem; padding: 2px 7px; border-radius: 999px; background: var(--bg-sunken); color: var(--text-muted); }
  .vencida { border-color: var(--amber-border); }

  .empty { color: var(--text-faint); font-style: italic; padding: 20px 0; text-align: center; }

  .onboarding-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .onboarding-card { max-width: 480px; width: 100%; }

  .toggle-link {
    background: none; border: none; color: var(--accent); text-decoration: underline; font-size: .88rem;
    min-height: 44px; display: flex; align-items: center; width: 100%; text-align: left;
  }

  dialog#config-dialog {
    border: none; border-radius: var(--radius); padding: 0; max-width: 480px; width: calc(100% - 32px);
    background: var(--bg-elevated); color: var(--text);
  }
  dialog#config-dialog::backdrop { background: rgba(0,0,0,0.45); }
  .dialog-inner { padding: 18px; max-height: 85vh; overflow-y: auto; }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

  .field-hint { font-size: .78rem; color: var(--text-faint); margin-top: 4px; }

  @media (min-width: 640px) {
    nav.tabs { position: sticky; }
  }
</style>
</head>

function toDay(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
}
function toISO(day) {
  const d = new Date(day * 86400000);
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  const dd = String(d.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function addDays(iso, n) { return toISO(toDay(iso) + n); }
function diffDays(a, b) { return toDay(b) - toDay(a); }

  ['Química', 14],
  ['Biologia', 14],
  ['Português e Literatura', 14],
  ['Inglês', 8],
  ['História e Geografia', 18],
  ['Filosofia e Sociologia', 4],
];

function buildQueue(fases) {
  /** @type {Sessao[]} */
  const sessions = [];
  let globalIndex = 0;

  for (const faseObj of fases) {
    const pools = faseObj.itens.map((item, idx) => ({
      materia: item[0], topico: item[1], modo: item[3], remaining: item[2], order: idx,
    }));

    function pickBest(excludeMateria) {
      let candidates = pools.filter((p) => p.remaining > 0 && (excludeMateria === null || p.materia !== excludeMateria));
      if (candidates.length === 0 && excludeMateria !== null) {
        candidates = pools.filter((p) => p.remaining > 0);
      }
      if (candidates.length === 0) return null;
      candidates.sort((a, b) => {
        if (b.remaining !== a.remaining) return b.remaining - a.remaining;
        if (a.materia !== b.materia) return a.materia < b.materia ? -1 : 1;
        return a.order - b.order;
      });
      return candidates[0];
    }

    while (pools.some((p) => p.remaining > 0)) {
      const first = pickBest(null);
      if (!first) break;
      first.remaining--;
      const blocks = [{ materia: first.materia, topico: first.topico, modo: first.modo }];
      const second = pickBest(first.materia);
      if (second) {
        second.remaining--;
        blocks.push({ materia: second.materia, topico: second.topico, modo: second.modo });
      }
      sessions.push({ index: globalIndex++, fase: faseObj.fase, blocks });
    }
  }
  return sessions;
}

const INTERVALOS_REVISAO = [1, 3, 7, 30];

function criarErro(dados, id, dataRegistro) {
  return {
    id,
    materia: dados.materia,
    topico: dados.topico,
    causa: dados.causa,
    origem: dados.origem || '',
    anotacao: dados.anotacao || '',
    dataRegistro,
    nivel: 0,
    proxima: addDays(dataRegistro, INTERVALOS_REVISAO[0]),
    acertos: 0,
    erros: 0,
  };
}

function revisarErro(erro, hoje, acertou) {
  if (acertou) {
    if (erro.nivel >= INTERVALOS_REVISAO.length - 1) {
      return Object.assign({}, erro, { proxima: '', acertos: erro.acertos + 1 });
    }
    const novoNivel = erro.nivel + 1;
    return Object.assign({}, erro, {
      nivel: novoNivel,
      proxima: addDays(hoje, INTERVALOS_REVISAO[novoNivel]),
      acertos: erro.acertos + 1,
    });
  }
  return Object.assign({}, erro, {
    nivel: 0,
    proxima: addDays(hoje, INTERVALOS_REVISAO[0]),
    erros: erro.erros + 1,
  });
}

function getVencidas(erros, hoje) {
  return erros
    .filter((e) => e.proxima !== '' && e.proxima <= hoje)
    .slice()
    .sort((a, b) => (a.proxima < b.proxima ? -1 : a.proxima > b.proxima ? 1 : 0));
}

const DATA_LIMITE_FILA = '2026-11-22';
const DATA_PROVA = '2026-11-29';
const DATA_LIMITE_INSCRICAO = '2026-10-08';
const TOTAL_SESSOES = 65;

function calcRitmo(hoje, datasConcluidas, opts) {
  const total = (opts && opts.total) || TOTAL_SESSOES;
  const dataLimite = (opts && opts.dataLimite) || DATA_LIMITE_FILA;
  const semanasRestantes = Math.max(0, diffDays(hoje, dataLimite)) / 7;
  const concluidas = datasConcluidas.length;

  let ritmo = 0;
  if (concluidas > 0) {
    const primeira = datasConcluidas[0];
    const dias = Math.max(7, diffDays(primeira, hoje) + 1);
    ritmo = (concluidas / dias) * 7;
  }
  const projecao = Math.min(total, Math.round(concluidas + ritmo * semanasRestantes));
  const necessario = semanasRestantes > 0 ? (total - concluidas) / semanasRestantes : 0;
  return { concluidas, ritmo, projecao, necessario, semanasRestantes };
}

function isVespera(hoje, dataLimite) { return toDay(hoje) >= toDay(dataLimite || DATA_LIMITE_FILA); }
function diasRestantesProva(hoje, dataProva) { return diffDays(hoje, dataProva || DATA_PROVA); }
function statusInscricao(hoje, inscricaoFeita, limite) {
  if (inscricaoFeita) return 'ok';
  return toDay(hoje) > toDay(limite || DATA_LIMITE_INSCRICAO) ? 'critico' : 'fixo';
}
function calcDesempenho(acertosTotal, notaRedacao) { return ((acertosTotal + notaRedacao) / 110) * 100; }

function interpretarGargalo(contagens) {
  const { naoSabia, errouConta, interpretouMal } = contagens;
  if (naoSabia === 0 && errouConta === 0 && interpretouMal === 0) return '';
  if (errouConta >= naoSabia && errouConta >= interpretouMal) return 'o gargalo é base algébrica';
  if (naoSabia >= errouConta && naoSabia >= interpretouMal) return 'o gargalo é cobertura de conteúdo';
  return 'o gargalo é leitura sob pressão — treine cronometrado';
}

function computeTimerState(iniciadoEm, modo, nowMs) {
  const [estudoMin, pausaMin] = modo.split('/').map(Number);
  const estudoMs = estudoMin * 60000;
  const pausaMs = pausaMin * 60000;
  const cicloMs = estudoMs + pausaMs;
  const ciclos = Math.max(1, Math.round(3600000 / cicloMs));
  const totalMs = ciclos * cicloMs;
  const elapsed = Math.max(0, nowMs - iniciadoEm);
  if (elapsed >= totalMs) return { concluido: true, ciclo: ciclos, totalCiclos: ciclos, fase: 'concluido', restanteMs: 0 };
  const cicloIdx = Math.floor(elapsed / cicloMs);
  const dentroCiclo = elapsed - cicloIdx * cicloMs;
  if (dentroCiclo < estudoMs) return { concluido: false, ciclo: cicloIdx + 1, totalCiclos: ciclos, fase: 'estudo', restanteMs: estudoMs - dentroCiclo };
  return { concluido: false, ciclo: cicloIdx + 1, totalCiclos: ciclos, fase: 'pausa', restanteMs: cicloMs - dentroCiclo };
}

/* =========================================================================
 * ÁUDIO — oscilador Web Audio, sem arquivo externo
 * ========================================================================= */

/** @type {AudioContext|null} */
let audioCtx = null;
/** @param {number} freq @param {number} durMs */
function beep(freq, durMs) {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || /** @type {any} */ (window).webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durMs / 1000);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durMs / 1000 + 0.02);
  } catch (e) { /* Web Audio indisponível */ }
}

/* =========================================================================
 * TIMER — ticking por timestamp
 * ========================================================================= */

let tickHandle = null;
let ultimaFaseTimer = null;

function timerBlocoKey() {
  const id = sessaoAtualId();
  if (id == null || !STATE.timer) return null;
  return `${id}:${STATE.timer.blocoIndex}`;
}

function garantirTick() {
  const precisa = !!STATE.timer && STATE.telaAtiva === 'hoje' && !dialogById('config-dialog').open;
  if (precisa && !tickHandle) {
    tickHandle = setInterval(tick, 1000);
  } else if (!precisa && tickHandle) {
    clearInterval(tickHandle);
    tickHandle = null;
  }
}

function tick() {
  if (!STATE.timer) { garantirTick(); return; }
  const st = computeTimerState(STATE.timer.iniciadoEm, STATE.timer.modo, Date.now());
  const chave = timerBlocoKey() + ':' + st.fase;
  if (chave !== ultimaFaseTimer) {
    ultimaFaseTimer = chave;
    if (st.fase === 'pausa') beep(660, 220);
    else if (st.fase === 'estudo' && st.ciclo > 1) beep(880, 220);
    else if (st.fase === 'concluido') { beep(880, 180); setTimeout(() => beep(1046, 260), 220); }
  }
  renderConteudo();
  garantirTick();
}

/* =========================================================================
 * ESCAPE / FORMATAÇÃO
 * ========================================================================= */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}
function fmtMin(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function fmtNum(n, casas) {
  return n.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
}
function fmtDataBR(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

/* =========================================================================

  if (!el) throw new Error('elemento não encontrado: ' + id);

}
/** @param {string} id @returns {HTMLInputElement} */
function inputById(id) { return /** @type {HTMLInputElement} */ (byId(id)); }
/** @param {string} id @returns {HTMLTextAreaElement} */
function textareaById(id) { return /** @type {HTMLTextAreaElement} */ (byId(id)); }
/** @param {string} id @returns {HTMLDialogElement} */
function dialogById(id) { return /** @type {HTMLDialogElement} */ (byId(id)); }
/** @param {EventTarget|null} target @returns {HTMLElement} */
function asEl(target) { return /** @type {HTMLElement} */ (target); }
/** @param {Element} el @returns {HTMLInputElement} */
function asInput(el) { return /** @type {HTMLInputElement} */ (el); }

/* =========================================================================

function render() {
  const app = byId('app');
  if (!STATE.onboardingCompleto) {
    app.innerHTML = viewOnboarding();
    garantirTick();
    return;
  }
  app.innerHTML = viewShell();
  renderConteudo();
  renderConfigDialog();
  aplicarTema();
  garantirTick();
}

function renderConteudo() {
  const el = document.getElementById('conteudo');
  if (!el) return;
  const hoje = hojeISO();
  if (STATE.telaAtiva === 'hoje') el.innerHTML = viewHoje(hoje);
  else if (STATE.telaAtiva === 'fila') el.innerHTML = viewFila(hoje);
  else if (STATE.telaAtiva === 'erros') el.innerHTML = viewErros(hoje);
  else if (STATE.telaAtiva === 'progresso') el.innerHTML = viewProgresso(hoje);
}

function aplicarTema() {
  const root = document.documentElement;
  if (STATE.tema === 'light') root.setAttribute('data-theme', 'light');
  else if (STATE.tema === 'dark') root.setAttribute('data-theme', 'dark');
  else root.removeAttribute('data-theme');
}

    const feitas = ids.filter((id) => STATE.status[id] === 'concluida');
    const pendentes = ids.filter((id) => STATE.status[id] !== 'concluida');
    const mostrarFeitas = !!STATE.mostrarConcluidasPorFase[faseNome];

    html += `<div class="fase-group">
      <div class="fase-header">
        <h3 style="margin:0;">${faseNome}</h3>
        <span class="faint mono">${feitas.length}/${ids.length}</span>
      </div>`;

    if (feitas.length > 0) {
      html += `<button class="toggle-link" data-action="toggle-concluidas-fase" data-fase="${faseNome}">
        ${mostrarFeitas ? 'ocultar concluídas' : `mostrar ${feitas.length} concluída${feitas.length === 1 ? '' : 's'}`}
      </button>`;
      if (mostrarFeitas) {
        html += feitas.map((id) => sessaoItemHtml(id, atualId)).join('');
      }
    }
    html += pendentes.map((id) => sessaoItemHtml(id, atualId)).join('');
    html += `</div>`;
  }

  return html;
}

function sessaoItemHtml(id, atualId) {
  const s = sessaoPorId(id);
  const concluida = STATE.status[id] === 'concluida';
  const atual = id === atualId;
  return `
    <div class="sessao-item ${concluida ? 'concluida' : ''} ${atual ? 'atual' : ''}">
      <span class="sessao-idx mono">${id + 1}</span>
      <span class="sessao-blocos">
        ${s.blocks.map((b) => `<span class="b">${esc(b.materia)} · ${esc(b.topico)}</span>`).join(' + ')}
      </span>
    </div>
  `;
}

function listaErrosHtml(hoje) {
  let lista = STATE.erros.slice();
  if (STATE.filtroErroMateria) lista = lista.filter((e) => e.materia === STATE.filtroErroMateria);
  if (STATE.filtroErroCausa) lista = lista.filter((e) => e.causa === STATE.filtroErroCausa);
  lista.sort((a, b) => (a.proxima || '9999') < (b.proxima || '9999') ? -1 : 1);

  if (lista.length === 0) return `<p class="empty">Nenhum erro registrado com esse filtro.</p>`;
  return lista.map((e) => erroCardHtml(e, hoje)).join('');
}

function erroCardHtml(e, hoje) {
  const vencida = e.proxima !== '' && e.proxima <= hoje;
  const concluido = e.proxima === '';
  const causaLabel = (CAUSAS.find((c) => c[0] === e.causa) || [null, e.causa])[1];
  const emRevisao = STATE.revisandoErroId === e.id;

  let corpo = `
    <div class="erro-top">
      <div>
        <strong>${esc(e.materia)}</strong> — ${esc(e.topico)}
        <div class="faint">${causaLabel}${e.origem ? ` · ${esc(e.origem)}` : ''}</div>
      </div>
      <span class="tag">${e.acertos}✓ ${e.erros}✗</span>
    </div>
  `;

  if (e.anotacao) corpo += `<p class="small" style="margin-top:6px;">${esc(e.anotacao)}</p>`;

  if (concluido) {
    corpo += `<p class="small muted" style="margin-top:8px;">revisão concluída — não aparece mais nas vencidas.</p>`;
  } else if (!vencida) {
    corpo += `<p class="small muted" style="margin-top:8px;">próxima revisão: ${fmtDataBR(e.proxima)}</p>`;
  } else if (!emRevisao) {
    corpo += `
      <div class="row" style="margin-top:8px;">
        <span class="small">vence em ${fmtDataBR(e.proxima)}</span>
        <button class="btn small" data-action="abrir-revisao" data-id="${e.id}">revisar</button>
      </div>
    `;
  } else {
    corpo += `
      <div style="margin-top:8px; padding:10px; background:var(--bg-sunken); border-radius:var(--radius);">
        <p class="small muted" style="margin-bottom:8px;">Responda de novo antes de conferir: <strong>${esc(e.materia)}</strong> — ${esc(e.topico)}${e.origem ? ` (${esc(e.origem)})` : ''}.</p>
        <div class="row">
          <button class="btn small primary" data-action="revisar-erro" data-id="${e.id}" data-acertou="1">acertei</button>
          <button class="btn small" data-action="revisar-erro" data-id="${e.id}" data-acertou="0">errei de novo</button>
        </div>
      </div>
    `;
  }

  return `<div class="erro-item ${vencida ? 'vencida' : ''}">${corpo}</div>`;
}

/* ---- Tela Progresso ------------------------------------------------ */

function viewProgresso(hoje) {
  let html = '<div class="card"><h2>Horas por matéria</h2>';
  const planejado = {};
  for (const fase of FASES) for (const [materia, , horas] of fase.itens) planejado[materia] = (planejado[materia] || 0) + horas;

  const concluido = {};
  for (const id of STATE.ordem) {
    const s = sessaoPorId(id);
    const checks = checksDe(id);
    s.blocks.forEach((b, i) => {
      const feito = STATE.status[id] === 'concluida' || checks[i];
      if (feito) concluido[b.materia] = (concluido[b.materia] || 0) + 1;
    });
  }

  const materiasOrdenadas = Object.keys(planejado).sort((a, b) => planejado[b] - planejado[a]);
  for (const materia of materiasOrdenadas) {
    const total = planejado[materia];
    const feito = Math.min(total, concluido[materia] || 0);
    const pct = total > 0 ? (feito / total) * 100 : 0;
    html += `
      <div class="bar-row">
        <div class="bar-label"><span>${esc(materia)}</span><span class="mono">${feito}h / ${total}h</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }
  html += '</div>';

  html += '<div class="card"><h2>Tópicos cobertos vs. peso na prova</h2>';
  for (const materia of Object.keys(PESOS)) {
    html += `<h3 style="margin-top:10px;">${esc(materia)}</h3>`;
    const pesos = PESOS[materia];
    const pesoMax = Math.max(...pesos.map((p) => p[1]));
    for (const [topico, peso] of pesos) {
      const fontes = (MAPA_COBERTURA[materia] && MAPA_COBERTURA[materia][topico]) || [];
      let horasFeitas = 0, horasTotais = 0;
      for (const fonte of fontes) {
        for (const fase of FASES) {
          for (const [m, t, h] of fase.itens) {
            if (m === materia && t === fonte) horasTotais += h;
          }
        }
      }
      for (const id of STATE.ordem) {
        const s = sessaoPorId(id);
        const checks = checksDe(id);
        s.blocks.forEach((b, i) => {
          if (b.materia === materia && fontes.includes(b.topico)) {
            const feito = STATE.status[id] === 'concluida' || checks[i];
            if (feito) horasFeitas++;
          }
        });
      }
      let estado;
      if (fontes.length === 0) estado = 'fora do plano';
      else if (horasFeitas === 0) estado = 'não iniciado';
      else if (horasFeitas >= horasTotais) estado = 'coberto';
      else estado = 'em andamento';

      html += `
        <div class="bar-row">
          <div class="bar-label"><span>${esc(topico)}</span><span class="faint">${estado}</span></div>
          <div class="bar-track"><div class="bar-fill amber" style="width:${(peso / pesoMax) * 100}%"></div></div>
        </div>
      `;
    }
  }
  html += '</div>';

  html += viewCausasErro();
  html += viewSimulados();

  return html;
}

function viewCausasErro() {
  const contagens = { naoSabia: 0, errouConta: 0, interpretouMal: 0 };
  for (const e of STATE.erros) {
    if (e.causa === 'nao-sabia') contagens.naoSabia++;
    else if (e.causa === 'errou-conta') contagens.errouConta++;
    else if (e.causa === 'interpretou-mal') contagens.interpretouMal++;
  }
  const max = Math.max(1, contagens.naoSabia, contagens.errouConta, contagens.interpretouMal);
  const gargalo = interpretarGargalo(contagens);
  /** @type {ParTopicoPeso[]} */
  const linhas = [
    ['não sabia', contagens.naoSabia],
    ['sabia e errei conta', contagens.errouConta],
    ['interpretei mal', contagens.interpretouMal],
  ];
  return `
    <div class="card">
      <h2>Distribuição das causas de erro</h2>
      ${linhas.map(([label, n]) => `
        <div class="bar-row">
          <div class="bar-label"><span>${label}</span><span class="mono">${n}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(n / max) * 100}%"></div></div>
        </div>
      `).join('')}
      ${gargalo ? `<p class="small" style="margin-top:6px;"><strong>${gargalo}</strong></p>` : '<p class="faint">Sem erros registrados ainda.</p>'}
    </div>
  `;
}

function viewSimulados() {
  let html = `

      <form id="form-simulado" data-action="registrar-simulado">

/* =========================================================================
 * DELEGAÇÃO DE EVENTOS — um único ponto de despacho por data-action
 * ========================================================================= */

function handleClick(e) {
  const alvo = /** @type {HTMLElement|null} */ (asEl(e.target).closest('[data-action]'));
  if (!alvo) return;
  const t = alvo;
  const action = t.dataset.action;

  if (action === 'ir-tela') { mutate((s) => { s.telaAtiva = t.dataset.tela; }); return; }

  if (action === 'abrir-config') { dialogById('config-dialog').showModal(); garantirTick(); return; }
  if (action === 'fechar-config') { dialogById('config-dialog').close(); garantirTick(); return; }

  if (action === 'marcar-inscricao') { mutate((s) => { s.inscricaoFeita = true; }); return; }
  if (action === 'toggle-inscricao') { mutate((s) => { s.inscricaoFeita = asInput(t).checked; }); return; }

  if (action === 'toggle-vespera') {
    const i = Number(t.dataset.i);
    const marcado = asInput(t).checked;
    mutate((s) => { s.vesperaChecks[i] = marcado; });
    return;
  }

  if (action === 'toggle-bloco') {
    const id = sessaoAtualId();
    if (id == null) return;
    const i = Number(t.dataset.bloco);
    const marcado = asInput(t).checked;
    mutate((s) => {
      if (!s.checks[id]) s.checks[id] = [false, false];
      s.checks[id][i] = marcado;
    });
    return;
  }

  if (action === 'concluir-sessao') {
    const id = sessaoAtualId();
    if (id == null) return;
    const checks = checksDe(id);
    if (!(checks[0] && checks[1])) return;
    mutate((s) => {
      s.status[id] = 'concluida';
      s.dataConclusao[id] = hojeISO();
      s.timer = null;
    });
    ultimaFaseTimer = null;
    return;
  }

  if (action === 'pular-sessao') {
    const id = sessaoAtualId();
    if (id == null) return;
    mutate((s) => {
      const pos = s.ordem.indexOf(id);
      s.ordem.splice(pos, 1);
      s.ordem.push(id);
      s.timer = null;
    });
    ultimaFaseTimer = null;
    return;
  }

  if (action === 'timer-iniciar') {
    const bloco = Number(t.dataset.bloco);
    const id = sessaoAtualId();
    if (id == null) return;
    const sessao = sessaoPorId(id);
    beep(880, 150);
    mutate((s) => {
      s.timer = { blocoIndex: bloco, iniciadoEm: Date.now(), modo: sessao.blocks[bloco].modo };
    });
    return;
  }

  if (action === 'timer-parar') {
    mutate((s) => { s.timer = null; });
    ultimaFaseTimer = null;
    return;
  }

  if (action === 'toggle-concluidas-fase') {
    const fase = t.dataset.fase;
    if (!fase) return;
    mutate((s) => {
      s.mostrarConcluidasPorFase[fase] = !s.mostrarConcluidasPorFase[fase];
    });
    return;
  }

  if (action === 'abrir-revisao') {
    const id = t.dataset.id;
    if (!id) return;
    mutate((s) => { s.revisandoErroId = id; });
    return;
  }

  if (action === 'revisar-erro') {
    const id = t.dataset.id;
    const acertou = t.dataset.acertou === '1';
    mutate((s) => {
      const idx = s.erros.findIndex((er) => er.id === id);
      if (idx >= 0) s.erros[idx] = revisarErro(s.erros[idx], hojeISO(), acertou);
      s.revisandoErroId = null;
    });
    return;
  }

  if (action === 'escolher-causa') {
    document.querySelectorAll('.causa-btn').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    t.setAttribute('aria-pressed', 'true');
    inputById('erro-causa-valor').value = t.dataset.causa || '';
    return;
  }

  if (action === 'exportar-json') { exportarJSON(); return; }
  if (action === 'importar-json') { inputById('import-file').click(); return; }

  if (action === 'onboarding-salvar') {
    const val = textareaById('onboarding-frase').value.trim();
    if (!val) return;
    mutate((s) => { s.fraseIntencao = val; s.onboardingCompleto = true; });
    return;
  }

  if (action === 'salvar-frase') {
    const val = textareaById('config-frase').value.trim();
    mutate((s) => { s.fraseIntencao = val; });
    return;
  }
}

function handleChange(e) {
  const origem = asEl(e.target);
  const t = /** @type {HTMLElement|null} */ (origem.closest('[data-action]'));
  if (t) {
    const action = t.dataset.action;
    const valor = asInput(t).value;
    if (action === 'mudar-tema') { mutate((s) => { s.tema = valor; }); return; }
    if (action === 'filtro-materia') { mutate((s) => { s.filtroErroMateria = valor; }); return; }
    if (action === 'filtro-causa') { mutate((s) => { s.filtroErroCausa = valor; }); return; }
  }

  if (origem.id === 'erro-materia') {
    const materia = asInput(origem).value;
    const topicoSelect = byId('erro-topico');
    const topicos = TOPICOS_ERRO[materia] || [];
    topicoSelect.innerHTML = topicos.map((tp) => `<option value="${esc(tp)}">${esc(tp)}</option>`).join('');
    return;
  }

  if (origem.id === 'import-file') {
    const files = asInput(origem).files;
    const file = files && files[0];
    if (file) importarJSON(file);
    return;
  }
}

function handleSubmit(e) {
  const alvo = /** @type {HTMLFormElement|null} */ (asEl(e.target).closest('[data-action]'));
  if (!alvo) return;
  e.preventDefault();
  const form = alvo;
  const action = form.dataset.action;

  if (action === 'registrar-erro') {
    const fd = new FormData(form);
    const materia = String(fd.get('materia') || '');
    const topico = String(fd.get('topico') || '');
    const causa = String(fd.get('causa') || '');
    if (!materia || !topico || !causa) return;
    mutate((s) => {
      const id = 'erro-' + s.proximoErroId++;
      s.erros.push(criarErro({
        materia, topico, causa,
        origem: String(fd.get('origem') || ''),
        anotacao: String(fd.get('anotacao') || ''),
      }, id, hojeISO()));
    });
    return;
  }

  if (action === 'registrar-simulado') {
    const fd = new FormData(form);
    const data = String(fd.get('data') || '');
    const redacao = Number(fd.get('redacao'));
    /** @type {Record<string, number>} */
    const acertosPorMateria = {};
    for (const [materia] of SIMULADO_MATERIAS) {
      acertosPorMateria[materia] = Number(fd.get('acertos-' + materia)) || 0;
    }
    if (!data || Number.isNaN(redacao)) return;
    mutate((s) => { s.simulados.push({ data, acertosPorMateria, redacao }); });
    return;
  }
}

function exportarJSON() {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fila-udesc-${hojeISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/** @param {File} file */
function importarJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const dados = JSON.parse(String(reader.result));
      if (dados && dados.v === 1) {
        STATE = Object.assign(estadoPadrao(), dados);
        salvar();
        render();
      }
    } catch (e) { /* JSON inválido — ignora silenciosamente */ }
  };
  reader.readAsText(file);
}

/* =========================================================================
 * INICIALIZAÇÃO
 * ========================================================================= */

document.addEventListener('click', handleClick);
document.addEventListener('change', handleChange);
document.addEventListener('submit', handleSubmit);

render();
</script>
